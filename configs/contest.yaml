# ============================================================================
# SRM 校内赛自瞄赛道配置
#
# 协议来源：《SRM 校内赛自瞄通信协议》（control-2026 / infantry_leg&prostrate,
#           参考提交 f7b83a58e8dc8af13ae5f328687c2fd7462e8b80）
#
# ★ = 必须自己标定/实测后修改的参数
# ============================================================================

#####-----敌方颜色-----#####
# Tracker 用它过滤装甲板（tracker.cpp 的 armors.remove_if）。
# 必须与靶标上贴的灯条颜色一致，否则会把目标全部过滤掉，一枪都打不出。
# enemy_color: "red"
enemy_color: "blue"

#####-----姿态正方向约定-----#####
# 协议只规定 yaw/pitch 是"角度制"，没有定义正负方向。
# 代码内部约定：世界坐标系下 pitch 向上为负（见 aimer.cpp）。
# 通电实测方法：手动把云台抬到明显仰角，看 1Hz 状态行里 gimbal pitch 的正负。
#   - 若与代码约定相反，把 pitch_sign 改成 -1
#   - yaw 同理
yaw_sign: 1
pitch_sign: 1

#####-----通信（USB CDC 虚拟串口）-----#####
# 下位机为 STM32 USB CDC，不使用固定波特率；baudrate 只是 serial 库的参数占位。
# 设备名通常为 /dev/ttyACM0；若有 udev 软链也可写 /dev/gimbal。
com_port: "/dev/ttyACM0"
baudrate: 115200
# 读超时（毫秒）。必须 > 0，否则 read() 会永久阻塞、程序无法退出。
rx_timeout_ms: 20
# 协议 4.2：裁判系统未注入弹速时下位机内部默认 22.0；这里做同样的兜底。
default_bullet_speed: 22.0

#####-----神经网络（识别）-----#####
# 路径可以是相对路径（会依次相对 cwd、配置文件目录、可执行文件目录解析）
# 也可以是绝对路径。部署时建议写绝对路径。
yolo_name: yolov8
yolov5_model_path: assets/yolov5.xml
yolov8_model_path: assets/yolov8.xml
yolo11_model_path: assets/yolo11.xml
classify_model: assets/tiny_resnet.onnx
# CPU | GPU。GPU 需要额外安装 Intel compute-runtime；本模型很小，CPU 通常够用。
device: CPU
# 检测置信度下限。靶标单一、背景干净，可以调高到 0.9 来压制误检。
min_confidence: 0.8
# 是否用传统方法二次矫正神经网络的四角点（精度优先，建议先开）
# false = 纯神经网络角点（更快，但角点略抖）
use_traditional: true

#####-----ROI-----#####
# 只在 ROI 内做识别可明显提速。开启后 x/y/width/height 必须与相机实际分辨率匹配。
use_roi: false
roi:
  x: 0
  y: 0
  width: -1    # -1 表示该维度不裁切
  height: -1

#####-----传统方法参数（use_traditional: true 时生效）-----#####
threshold: 150              # 二值化阈值，靶标灯条越暗越要调低
max_angle_error: 45         # degree，灯条与竖直方向的最大偏差
min_lightbar_ratio: 1.5     # 灯条长宽比下限
max_lightbar_ratio: 20      # 灯条长宽比上限
min_lightbar_length: 8      # 灯条最小像素长度
min_armor_ratio: 1          # 装甲板宽/灯条长 之比下限
max_armor_ratio: 5          # 装甲板宽/灯条长 之比上限
max_side_ratio: 1.5         # 左右灯条长度之比上限
max_rectangular_error: 25   # degree，灯条与中点连线夹角偏差

#####-----tracker 参数-----#####
min_detect_count: 5               # 连续检出 N 帧才进入 tracking
# 靶标连续旋转时侧面会短暂消失，可适当调大（如 20~30）
max_temp_lost_count: 15           # 连续丢失 N 帧才放弃
outpost_max_temp_lost_count: 75   # 前哨站专用，本赛制不使用，但代码要求存在

#####-----aimer 参数-----#####
# ★ 下面两个 offset 是保证命中的关键，必须实测后修正
#   它们同时吸收：相机-枪管外参残差、手眼标定残差
yaw_offset: 0.0             # degree
pitch_offset: 0.0           # degree
# 小陀螺判定
comming_angle: 55           # degree，迎面而来的装甲板角门限
leaving_angle: 20           # degree，正在离开的装甲板角门限
decision_speed: 7           # rad/s，判定"高速小陀螺"的角速度阈值
# ★ 预测时间余量，用于补偿 图像传输 + 推理 + 通信 + 下位机控制 的总延迟。
#   起步值沿用原工程；必须用 delay_calib 或慢动作视频实测后修正。
#   注意：靶标 5m、弹速 22m/s 时飞行时间约 0.23s，对延迟极敏感。
low_speed_delay_time: 0.015   # s
high_speed_delay_time: 0.015  # s

#####-----shooter 参数-----#####
# 靶标固定 5m > judge_distance，因此实际生效的是 second_tolerance。
# 140x125mm 靶标在 5m 处视角约 1.4°，2 度容差偏松、会浪费子弹。
# ★ 建议从 0.5~1.0 度开始试，这是提高命中率最直接的旋钮。
first_tolerance: 3          # degree，近距离瞄准误差容差
second_tolerance: 2         # degree，远距离瞄准误差容差
judge_distance: 2           # m，远近判断阈值
auto_fire: true             # 是否由自瞄决定开火（命令行 --no-fire 可临时覆盖）

#####-----相机-----#####
# 海康 CS016（MV-CS016-10UC）。SDK 已随仓库自带。
camera_name: "hikrobot"
exposure_ms: 2.5            # 靶标原地旋转，压低曝光减少运动模糊
gain: 16.9                  # 增益；配补光灯后可降低
vid_pid: "2bdf:0001"        # 用 lsusb 确认

#####-----相机内参与手眼外参（★ 必须自己标定）-----#####
# 规则书 2.2：相机内参、外参由参赛者自行标定。
#
# 重投影误差: 已标定
camera_matrix: [1810.71103612, 0, 710.209428178, 0, 1811.87241949, 541.525037924, 0, 0, 1]
distort_coeffs: [-0.0701983164164, 0.116281748818, 0.000236384441345, 1.46352889222e-05, 0]

# 新协议没有 IMU，相机刚性地固定在云台上，R_gimbal2imubody 不参与运算。
# 保留该键只是为了兼容 Solver 的构造流程。
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# ★ 相机 -> 云台 外参，决定 armor.xyz_in_gimbal / xyz_in_world，直接影响测距与 yaw
# 已经重新标定
R_camera2gimbal: [-0.05693266831, -0.00852297146166, 0.998341640039, 0.998119211697, -0.0232532652068, 0.0567214677086, 0.0227312674722, 0.999693275267, 0.00983081199176]
t_camera2gimbal: [0.115847860934, 0.0150495510697, 0.044444836278]

#####-----planner（本赛制不使用）-----#####
# 协议不提供 yaw/pitch 的角速度与角加速度通道，纯角度闭环，
# 因此不走 MPC Planner 路线（standard_mpc / auto_aim_debug_mpc）。
# 以下参数仅为兼容保留，contest 不会读取。
fire_thresh: 0.0035
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]
